version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teams_chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teams_chat_backend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chatdb
      DB_USERNAME: postgres
      DB_PASSWORD: secretpassword
      SPRING_PROFILES_ACTIVE: default

volumes:
  pgdata:
