server.port=8080

# H2 File Database Profile (instant zero-configuration testing)
spring.datasource.url=jdbc:h2:file:./chatdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console for inspection at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.teamchat=INFO
