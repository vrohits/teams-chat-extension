server.port=8080

# PostgreSQL Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/chatdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Hibernate automatically detects Dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Max payload size for chat messages
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.teamchat=INFO
logging.level.org.springframework.web.socket=INFO
